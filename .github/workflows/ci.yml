name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # テストの中の同期の無限ループは bun test の timeout では止まらず、既定では 360 分走り続ける。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - run: bun install --frozen-lockfile
      - run: bun run check

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 後の commit で消した secret も履歴に残るので、対象の全 commit を走査する。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan event commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
               git fetch --no-tags origin "$BASE_SHA"; then
              range="$BASE_SHA..$HEAD_SHA"
            else
              echo "::warning::Previous push commit unavailable; scanning all history reachable from the pushed head."
            fi
          fi
          docker run --rm -v "$PWD:/repo" --workdir /repo zricethezav/gitleaks:v8.30.1 git --redact --no-banner --log-opts="-m $range"
